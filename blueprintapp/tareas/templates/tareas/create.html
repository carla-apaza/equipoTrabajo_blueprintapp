{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="card-title h4 mb-4">Crear Nueva Tarea</h2>

                <form action="{{ url_for('bp_tarea.create') }}" method="POST">
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción de la tarea</label>
                        <input type="text" id="descripcion" name="descripcion" class="form-control" placeholder=""
                            required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" id="completado" name="completado" class="form-check-input">
                        <label for="completado" class="form-check-label">Marcar como completada inmediatamente</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('bp_tarea.index') }}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Tarea</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
