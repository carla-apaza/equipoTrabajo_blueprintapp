{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h3 class="card-title mb-0 h5">Modificar Datos del Miembro</h3>
            </div>
            <div class="card-body">
                <form action="{{ url_for('bp_miembro.edit', id=miembro.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ miembro.nombre }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" class="form-control" value="{{ miembro.email }}"
                            required>
                    </div>

                    <div class="d-flex justify-content-between pt-2">
                        <a href="{{ url_for('bp_miembro.index') }}" class="btn btn-secondary">Volver al listado</a>
                        <button type="submit" class="btn btn-warning">Actualizar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
